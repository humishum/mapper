<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Pointcloud Visualizer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #000;
      color: #fff;
      overflow: hidden;
    }

    #canvas-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #ae2424;  /* Slightly visible to verify canvas exists */
    }
    
    #canvas-container canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #info-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      padding: 20px;
      border-radius: 12px;
      max-width: 320px;
      max-height: 80vh;
      overflow-y: auto;
      z-index: 1000;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    #info-panel h2 {
      margin-bottom: 15px;
      font-size: 18px;
      font-weight: 600;
      color: #4CAF50;
    }

    #controls-panel {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      padding: 20px;
      border-radius: 12px;
      min-width: 280px;
      z-index: 1000;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    #controls-panel h2 {
      margin-bottom: 15px;
      font-size: 18px;
      font-weight: 600;
      color: #2196F3;
    }

    .control-group {
      margin-bottom: 16px;
    }

    .control-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.9);
    }

    .control-group input[type="range"] {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.2);
      outline: none;
      -webkit-appearance: none;
    }

    .control-group input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #2196F3;
      cursor: pointer;
      transition: background 0.2s;
    }

    .control-group input[type="range"]::-webkit-slider-thumb:hover {
      background: #42A5F5;
    }

    .control-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .control-group select {
      width: 100%;
      padding: 8px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
    }

    .control-group select:focus {
      outline: none;
      border-color: #2196F3;
    }

    .value-display {
      display: inline-block;
      float: right;
      color: #4CAF50;
      font-weight: 600;
    }

    .location-item {
      padding: 12px;
      margin-bottom: 10px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      font-size: 12px;
      border-left: 3px solid #4CAF50;
      transition: background 0.2s;
    }

    .location-item:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .location-item.no-data {
      border-left-color: #f44336;
      opacity: 0.6;
    }

    .location-item h4 {
      margin-bottom: 6px;
      font-size: 14px;
      color: #fff;
    }

    .location-item p {
      margin: 4px 0;
      color: rgba(255, 255, 255, 0.7);
    }

    .status-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      margin-left: 8px;
    }

    .status-badge.success {
      background: rgba(76, 175, 80, 0.2);
      color: #4CAF50;
    }

    .status-badge.error {
      background: rgba(244, 67, 54, 0.2);
      color: #f44336;
    }

    #loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.9);
      padding: 30px 40px;
      border-radius: 12px;
      z-index: 2000;
      text-align: center;
    }

    #loading.hidden {
      display: none;
    }

    .spinner {
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top: 3px solid #2196F3;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Scrollbar styling */
    #info-panel::-webkit-scrollbar {
      width: 6px;
    }

    #info-panel::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 3px;
    }

    #info-panel::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }

    #info-panel::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div>Loading pointcloud data...</div>
  </div>

  <div id="canvas-container"></div>

  <div id="info-panel">
    <h2>Locations</h2>
    <div id="location-list"></div>
  </div>

  <div id="controls-panel">
    <h2>Controls</h2>
    
    <div class="control-group">
      <label>
        Point Size
        <span class="value-display" id="point-size-value">10</span>
      </label>
      <input type="range" id="point-size" min="1" max="20" step="1" value="10">
    </div>

    <div class="control-group">
      <label>
        Point Cloud Scale
        <span class="value-display" id="scale-value">1.0</span>
      </label>
      <input type="range" id="scale" min="0.1" max="5" step="0.1" value="1.0">
    </div>

    <div class="control-group">
      <label>
        Opacity
        <span class="value-display" id="opacity-value">0.8</span>
      </label>
      <input type="range" id="opacity" min="0.1" max="1" step="0.05" value="0.8">
    </div>

    <div class="control-group">
      <label>
        <input type="checkbox" id="show-points" checked>
        Show Point Clouds
      </label>
    </div>

    <div class="control-group">
      <label>Camera Preset</label>
      <select id="camera-preset">
        <option value="overview">Overview</option>
        <option value="top">Top View</option>
        <option value="side">Side View</option>
        <option value="front">Front View</option>
      </select>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
