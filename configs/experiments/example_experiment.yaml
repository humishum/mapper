# Example Experiment Configuration
#
# Run with:
#   python -m src.experiments.runner --config configs/experiments/example_experiment.yaml

name: "trail_reconstruction_test"

# Model to use (must3r, vggt, da3_streaming, orb_slam)
model: "must3r"

# Model-specific configuration
model_config:
  weights_path: "weights/must3r/MUSt3R_512.pth"
  retrieval_path: "weights/must3r/MUSt3R_512_retrieval_trainingfree.pth"
  image_size: 512
  window_size: 500
  min_confidence: 5.0

# Input/Output folders
input_folder: "/path/to/videos"
output_folder: "/path/to/output"

# Processing options
fps: 10  # Backwards-compatible candidate extraction rate
keyframe_config:
  mode: "quality_motion"  # fixed_rate | quality_motion
  candidate_fps: 10       # Decode/sample ceiling
  target_fps: 2           # Fixed output rate or adaptive maximum-gap baseline
  min_interval_s: 0.25
  max_interval_s: 1.0
  min_sharpness: 25.0
  min_mean_luma: 12.0
  max_mean_luma: 243.0
  max_clipped_fraction: 0.85
  min_motion_fraction: 0.015
  min_angular_speed_rad_s: 0.35

# Record settings that affect the camera model but are not reliably available
# through ffprobe. These values are copied into capture_metadata.json.
capture_metadata:
  camera_model: null
  lens_mode: null
  hypersmooth: null
  crop_mode: null
  calibration_profile: null

align_to_gps: true  # Align output to GPS coordinates
force_reprocess: false  # Re-extract frames even if cached
frame_cache_dir: null  # Optional: override cache root (defaults to output_folder/_frame_cache)

# Canonical reconstruction-package v1 publication
package_config:
  copc_memory_limit: "4G"
  voxel_size_m: 0.02
  register_catalog: true
  catalog_path: "catalog.sqlite3"  # Relative paths resolve below output_folder

# Video filtering
video_extensions:
  - ".MP4"
  - ".MOV"
  - ".mp4"
  - ".mov"
