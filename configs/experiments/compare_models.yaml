# Model Comparison Experiment
#
# This is a template for comparing multiple models.
# Create one config per model and run each separately.
#
# Example workflow:
#   python -m src.experiments.runner --config configs/experiments/must3r_baseline.yaml
#   python -m src.experiments.runner --config configs/experiments/vggt_test.yaml
#   python -m src.experiments.runner --config configs/experiments/orb_slam_test.yaml
#
# Then compare results in the experiments/ output folders.

name: "must3r_baseline"

model: "must3r"

model_config:
  weights_path: "/path/to/must3r/weights.pth"
  retrieval_path: "/path/to/retrieval/data"
  image_size: 512

input_folder: "/path/to/test_videos"
output_folder: "/path/to/experiments"

fps: 10
align_to_gps: true
