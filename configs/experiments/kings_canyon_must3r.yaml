# Kings Canyon MASt3R Experiment
#
# Run with:
#   python -m src.experiments.runner --config configs/experiments/kings_canyon_must3r.yaml

name: "kings_canyon_must3r"

model: "must3r"

model_config:
  weights_path: "weights/must3r/MUSt3R_512.pth"
  retrieval_path: "weights/must3r/MUSt3R_512_retrieval_trainingfree.pth"
  image_size: 512

  # Chunked processing for VRAM limits
  use_chunking: true
  window_size: 50
  window_overlap: 10

  # Confidence remains a canonical per-point attribute. Points below this
  # minimum are omitted; threshold-family PLY files are no longer generated.
  min_confidence: 5.0

  # Memory settings
  num_mem_imgs: 30  # Reduced for low VRAM
  subsample: 2

input_folder: "data/input_kings_canyon"
output_folder: "data/output_kings_canyon"

fps: 10
align_to_gps: true
force_reprocess: false
frame_cache_dir: null  # Optional: override cache root (defaults to output_folder/_frame_cache)

package_config:
  copc_memory_limit: "4G"
  voxel_size_m: 0.02
  register_catalog: true
  catalog_path: "catalog.sqlite3"

alignment_config:
  window_alignment_method: "pose_overlap"
  min_overlap_frames: 10
  allow_scale: "auto"
  pose_overlap_max_rmse: 2.0
  icp_voxel_size: 0.1
  icp_max_corr_dist: 0.2
  icp_init: "none"
  min_gps_std_dev_m: 0.5
  save_alignment_debug: true

# use for just gopro stuff
video_extensions:
  - ".MP4"
