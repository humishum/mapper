# Kings Canyon MASt3R Experiment
#
# Run with:
#   python -m src.experiments.runner --config configs/experiments/kings_canyon_must3r.yaml

name: "kings_canyon_must3r"

model: "must3r"

model_config:
  weights_path: "/home/ape/repos/mapper/weights/MUSt3R_512_cvpr.pth"
  retrieval_path: "/home/ape/repos/mapper/weights/MUSt3R_512_retrieval_trainingfree.pth"
  image_size: 512

  # Chunked processing for VRAM limits
  use_chunking: true
  window_size: 50
  window_overlap: 10

  # Confidence thresholds for PLY output
  confidence_thresholds:
    - 5.0
    - 1.5

  # Memory settings
  num_mem_imgs: 30  # Reduced for low VRAM
  subsample: 2

input_folder: "/home/ape/repos/mapper/data/input_kings_canyon"
output_folder: "/home/ape/repos/mapper/data/output_kings_canyon"

fps: 10
align_to_gps: true
force_reprocess: false
frame_cache_dir: null  # Optional: override cache root (defaults to output_folder/_frame_cache)

alignment_config:
  window_alignment_method: "pose_overlap"
  min_overlap_frames: 10
  allow_scale: "auto"
  pose_overlap_max_rmse: 2.0
  icp_voxel_size: 0.1
  icp_max_corr_dist: 0.2
  icp_init: "none"
  gps_scale_min_std_dev_m: 0.5
  save_alignment_debug: false
