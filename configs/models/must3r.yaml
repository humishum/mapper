# MASt3R Model Configuration

# Model weights (required)
weights_path: null  # Set to path like: /path/to/must3r/weights.pth
retrieval_path: null  # Set to path for retrieval data

# Image processing
image_size: 512  # Input image size for model

# Windowing for long videos
use_chunking: true
window_size: 500  # Max frames per window
window_overlap: 20  # Overlap between windows

# Confidence is retained as a per-point COPC attribute. This only removes
# predictions below the model-quality floor.
min_confidence: 5.0

# Memory management
num_mem_imgs: 50  # Number of memory images for reconstruction
subsample: 2  # Frame subsampling factor

# Advanced parameters
min_conf_thr: 1.05
execution_mode: linseq  # Options: linseq, parallel
